project_id = "meeting-room-estimator"

[storage]
enabled = true
file_size_limit = "5MiB"

[storage.buckets.meeting-room-images]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]
objects_path = "./storage/meeting-room-images"

# This project does not use vector buckets. Keeping this explicit also prevents
# `seed buckets` from contacting the Vector Buckets API on hosted projects.
[storage.vector]
enabled = false
max_buckets = 10
max_indexes = 5
